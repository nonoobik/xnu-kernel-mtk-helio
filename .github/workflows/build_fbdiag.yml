name: Build fbdiag (Step 1)

on:
  workflow_dispatch:

jobs:
  build-fbdiag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld python3

      - name: Check board config
        run: python3 tools/boards.py check

      - name: Download rooted boot_a
        run: |
          mkdir -p backup
          curl -L -o backup/boot_a_magisk.img "https://github.com/nonoobik/xnu-kernel-mtk-helio/releases/download/v0.1/boot_a_magisk.img"

      - name: Build fbdiag.img
        env:
          HAKIOS_BOARD: x6716
        run: bash loader/build_fbdiag.sh

      - name: Upload fbdiag.img
        uses: actions/upload-artifact@v4
        with:
          name: fbdiag-x6716
          path: build/loader/fbdiag.img
          
